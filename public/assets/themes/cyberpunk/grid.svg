<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" height="100%" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for grid lines -->
    <linearGradient id="gridGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2DE2E6;stop-opacity:0.1"/>
      <stop offset="50%" style="stop-color:#FF2E97;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#2DE2E6;stop-opacity:0.1"/>
    </linearGradient>
    
    <!-- Pattern for the grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <!-- Vertical lines -->
      <path d="M 20 0 L 20 100" stroke="url(#gridGradient)" stroke-width="0.5"/>
      <!-- Horizontal lines -->
      <path d="M 0 20 L 100 20" stroke="url(#gridGradient)" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0A0C14"/>
  
  <!-- Grid overlay -->
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Diagonal accent lines -->
  <path d="M 0 0 L 100 100" stroke="#FF2E97" stroke-width="0.5" stroke-opacity="0.1"/>
  <path d="M 100 0 L 0 100" stroke="#2DE2E6" stroke-width="0.5" stroke-opacity="0.1"/>
</svg> 